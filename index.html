<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Want Soda?</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* This darkens the background slightly and loads the exact Pepsi fountain image */
            background: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), 
                        url('https://i.ibb.co/3mYmX7G/pepsi-fountain.jpg') no-repeat center center fixed;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            width: 90%;
            max-width: 450px;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.8rem;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px 20px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 2px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
            transition: 0.3s;
        }
        input[type="text"]:focus {
            border-color: #004b93;
            outline: none;
        }
        button {
            background-color: #004b93;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 10px;
            transition: background 0.2s;
            width: 100%;
        }
        button:hover {
            background-color: #002f5d;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="questionText">What soda would you like?</h1>
        <form id="sodaForm">
            <input type="text" id="sodaInput" placeholder="Type here..." required autofocus>
            <br>
            <button type="submit" id="submitBtn">Submit</button>
        </form>
    </div>

    <script>
        const questionText = document.getElementById('questionText');
        const sodaForm = document.getElementById('sodaForm');
        const sodaInput = document.getElementById('sodaInput');
        const submitBtn = document.getElementById('submitBtn');

        let stage = 1; 

        sodaForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const userResponse = sodaInput.value.trim();
            
            if (userResponse.toLowerCase() === 'pepsi') {
                triggerPepsiSequence();
                return;
            }

            if (stage === 1) {
                questionText.innerText = "PepSI?";
                stage = 2;
            } else if (stage === 2) {
                questionText.innerText = "PepSi, you wanted PEPSI?";
                stage = 3;
            } else {
                questionText.innerText = "Are you sure you don't want PEPSI?";
            }

            sodaInput.value = '';
        });

        function triggerPepsiSequence() {
            questionText.innerText = "ok be right back";
            sodaInput.classList.add('hidden');
            submitBtn.classList.add('hidden');

            setTimeout(function() {
                questionText.innerText = "here is Pepsi";
            }, 5000);
        }
    </script>

</body>
</html>
