<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Want Soda?</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: cyan;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
            width: 90%;
            max-width: 450px;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.8rem;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px 20px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 2px solid #ccc;
            border-radius: 8px;
            font-size: 1rem;
            transition: 0.3s;
        }
        input[type="text"]:focus {
            border-color: #004b93;
            outline: none;
        }
        button {
            background-color: #004b93;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 10px;
            transition: background 0.2s;
            width: 100%;
        }
        button:hover {
            background-color: #002f5d;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="questionText">What soda would you like?</h1>
        <form id="sodaForm">
            <input type="text" id="sodaInput" placeholder="Type here..." required autofocus>
            <br>
            <button type="submit" id="submitBtn">Submit</button>
        </form>
    </div>

    <script>
        const questionText = document.getElementById('questionText');
        const sodaForm = document.getElementById('sodaForm');
        const sodaInput = document.getElementById('sodaInput');
        const submitBtn = document.getElementById('submitBtn');

        // Array containing your 5 specific phrases
        const dialogues = [
            "PepSi?",
            "you want PepSI?",
            "PepSi PeeepsSI",
            "Pe Pe Pe pEpSI",
            "you want pepSi?"
        ];

        let currentIndex = 0; 

        sodaForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const userResponse = sodaInput.value.trim().toLowerCase();
            
            // Checks if 'pepsi' is typed anywhere
            if (userResponse.includes('pepsi')) {
                triggerPepsiSequence();
                return;
            }

            // Show the current dialogue from the list
            questionText.innerText = dialogues[currentIndex];

            // Move to the next dialogue phrase
            currentIndex++;

            // If we reach the end of the list, loop back to the first phrase (index 0)
            if (currentIndex >= dialogues.length) {
                currentIndex = 0;
            }

            sodaInput.value = '';
        });

        function triggerPepsiSequence() {
            questionText.innerText = "ok be right back";
